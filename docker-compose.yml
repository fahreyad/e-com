services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mishtikotha-app
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "8001:8001"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    command: "php artisan serve --host=0.0.0.0 --port=8001"
